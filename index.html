<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATS Resume Analyzer</title>
    <link rel="shortcut icon" href="assets/icons/resume_favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>ATS Resume Analyzer</h1>
      <p>
        Upload your resume and receive ATS-style feedback, keyword analysis, and
        improvement suggestions.
      </p>
    </header>

    <main>
      <section class="upload-section">
        <h2>Upload Resume</h2>
        <form id="resume-form">
          <label for="resume">Choose Resume</label>
          <input type="file" id="resume" name="resume" accept=".pdf" />
          <p id="file-error"></p>
          <button type="submit" id="analyzeBtn">Analyze Resume</button>
        </form>
      </section>

      <section class="result-section">
        <h2>Analysis Result</h2>
        <div class="card score-card">
          <h3>ATS Score</h3>
          <p id="score">--</p>
        </div>
        <div class="card skills-card">
          <h3>Detected Skills</h3>
          <ul id="skills-list"></ul>
        </div>
        <div class="card missing-card">
          <h3>Missing Keywords</h3>
          <ul id="missing-list"></ul>
        </div>
        <div class="card suggestion-card">
          <h3>Suggestions</h3>
          <ul id="suggestion-list"></ul>
        </div>
      </section>
    </main>

    <footer></footer>
    <script src="script.js"></script>
  </body>
</html>
